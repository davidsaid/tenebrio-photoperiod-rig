# Installed by deploy.sh as /etc/NetworkManager/conf.d/tenebrio-wifi-powersave.conf.
# 2 = power saving off. With it on, the Pi stayed on the home Wi-Fi but stopped answering
# incoming traffic overnight on 2026-10-17, so the website and SSH were unreachable while the
# rig kept running, and the hotspot fallback never started.
[connection]
wifi.powersave = 2
