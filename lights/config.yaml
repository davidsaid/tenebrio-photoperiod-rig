# Light schedule for the Tenebrio photoperiod rig.
#
# Every day, each treatment's light goes on at `light_on` and off at `light_off`, by the
# Pi's local clock. Times are "HH:MM" in quotes, 24-hour clock. A `light_off` earlier than
# `light_on` means the light period crosses midnight: "07:00" to "03:00" is 20 h of light.
# Before `start` every light is off; from `start` on, each light follows its times at once.
#
# Treatment ids match the relays on the HAT: treatment 1 = K1 ... treatment 4 = K4.
# A treatment left out of the list keeps its light off.
#
# `experiment` names the running experiment. Use letters, digits, ".", "_" or "-", no
# spaces: archiving the experiment uses it as a folder name.
#
# `readings_interval` is how often tenebrio_logger.py records a row of readings, "HH:MM:SS".
#
# The lights follow the local clock, so the dark period stays in the local night: on the
# night daylight saving time ends (2026-10-25), that dark period is an hour longer.

# Two lit treatments and an unlit control (David, 2026-10-10). Which treatment gets which
# photoperiod is still open. The control enclosure has no LEDs, so relays 3 and 4 are unused.
# PLACEHOLDER start: set the real one before the experiment. Until `start`, every light
# stays off.
experiment: experiment-1
start: 2026-10-20 08:00:00
readings_interval: "00:05:00"

# PLACEHOLDER times: 20L:4D and 4L:20D, with treatment 1's dark period in the night.
treatments:
  1:  # 20 h light, 4 h dark
    light_on: "07:00"
    light_off: "03:00"
  2:  # 4 h light, 20 h dark
    light_on: "09:00"
    light_off: "13:00"
